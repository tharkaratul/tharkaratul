<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Viewport: neutral — just needs to show the loading screen briefly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, follow" />
    <title>Atul Tharkar | Portfolio</title>

    <style>
      /* ── Loading screen ─────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --green:  #59ff66;
        --cyan:   #38bdf8;
        --bg:     #000;
        --mono:   "Courier New", Consolas, monospace;
      }

      html, body {
        width: 100%; height: 100%;
        background: var(--bg);
        color: var(--green);
        font-family: var(--mono);
        overflow: hidden;
      }

      /* Full-screen centered loader */
      #pf-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #000;
        z-index: 9999;
      }

      /* Scanline overlay for cyberpunk feel */
      #pf-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.018) 0,
          rgba(255,255,255,0.018) 1px,
          transparent 1px,
          transparent 4px
        );
        pointer-events: none;
        z-index: 1;
      }

      .pf-logo {
        position: relative;
        z-index: 2;
        font-size: clamp(11px, 2vw, 15px);
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--cyan);
        text-shadow: 0 0 14px rgba(56,189,248,0.6);
        animation: pf-pulse 2s ease-in-out infinite;
      }

      .pf-status {
        position: relative;
        z-index: 2;
        font-size: clamp(10px, 1.6vw, 13px);
        letter-spacing: 0.14em;
        color: rgba(89,255,102,0.85);
        min-height: 18px;
      }

      /* HUD spinner ring */
      .pf-ring-wrap {
        position: relative;
        z-index: 2;
        width: 72px;
        height: 72px;
      }
      .pf-ring {
        width: 100%; height: 100%;
        border-radius: 50%;
        border: 2px solid rgba(56,189,248,0.12);
        border-top-color: var(--cyan);
        border-right-color: rgba(56,189,248,0.45);
        animation: pf-spin 1.1s linear infinite;
        box-shadow: 0 0 18px rgba(56,189,248,0.25), inset 0 0 12px rgba(56,189,248,0.06);
      }
      .pf-ring-inner {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 1.5px solid rgba(89,255,102,0.12);
        border-bottom-color: rgba(89,255,102,0.6);
        animation: pf-spin 1.8s linear infinite reverse;
      }
      .pf-ring-dot {
        position: absolute;
        top: 50%; left: 50%;
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--cyan);
        transform: translate(-50%,-50%);
        box-shadow: 0 0 8px var(--cyan);
        animation: pf-pulse 1.4s ease-in-out infinite;
      }

      /* Signal bars — show confidence visually */
      .pf-signals {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: min(280px, 72vw);
        font-size: 10px;
        letter-spacing: 0.08em;
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .pf-signals.is-visible { opacity: 1; }

      .pf-sig-row {
        display: grid;
        grid-template-columns: 90px 1fr 36px;
        align-items: center;
        gap: 8px;
        color: rgba(255,255,255,0.55);
      }
      .pf-sig-bar-track {
        height: 4px;
        background: rgba(255,255,255,0.06);
        border-radius: 2px;
        overflow: hidden;
      }
      .pf-sig-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--cyan), var(--green));
        border-radius: 2px;
        transition: width 480ms cubic-bezier(0.22,1,0.36,1);
      }
      .pf-sig-val {
        text-align: right;
        color: var(--green);
      }

      /* Result badge */
      .pf-result {
        position: relative;
        z-index: 2;
        font-size: clamp(10px, 1.5vw, 12px);
        letter-spacing: 0.18em;
        color: rgba(56,189,248,0.7);
        text-transform: uppercase;
        min-height: 16px;
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .pf-result.is-visible { opacity: 1; }

      @keyframes pf-spin  { to { transform: rotate(360deg);  } }
      @keyframes pf-pulse {
        0%, 100% { opacity: 0.85; }
        50%       { opacity: 1; filter: brightness(1.2); }
      }
    </style>
  </head>
  <body>

    <!-- ── Loading screen ───────────────────────────────────────────────── -->
    <div id="pf-loader" role="status" aria-live="polite" aria-label="Detecting device">
      <span class="pf-logo">[ CYBER PORTFOLIO ]</span>

      <div class="pf-ring-wrap" aria-hidden="true">
        <div class="pf-ring"></div>
        <div class="pf-ring-inner"></div>
        <div class="pf-ring-dot"></div>
      </div>

      <p class="pf-status" id="pf-status">Initialising detection...</p>

      <!-- Signal confidence bars — filled by JS -->
      <div class="pf-signals" id="pf-signals" aria-hidden="true">
        <div class="pf-sig-row">
          <span>User-Agent</span>
          <div class="pf-sig-bar-track"><div class="pf-sig-bar-fill" id="sig-ua"></div></div>
          <span class="pf-sig-val" id="sigv-ua">–</span>
        </div>
        <div class="pf-sig-row">
          <span>Platform</span>
          <div class="pf-sig-bar-track"><div class="pf-sig-bar-fill" id="sig-pl"></div></div>
          <span class="pf-sig-val" id="sigv-pl">–</span>
        </div>
        <div class="pf-sig-row">
          <span>Touch</span>
          <div class="pf-sig-bar-track"><div class="pf-sig-bar-fill" id="sig-tc"></div></div>
          <span class="pf-sig-val" id="sigv-tc">–</span>
        </div>
        <div class="pf-sig-row">
          <span>Screen</span>
          <div class="pf-sig-bar-track"><div class="pf-sig-bar-fill" id="sig-sc"></div></div>
          <span class="pf-sig-val" id="sigv-sc">–</span>
        </div>
      </div>

      <p class="pf-result" id="pf-result"></p>
    </div>

    <script>
    /* ===================================================================
       DEVICE DETECTION & ROUTING ENGINE
       ===================================================================
       Architecture:
         detectDevice()  → returns { type, scores, signals, confidence }
         routeTo(type)   → sets sessionStorage flag, redirects
         run()           → orchestrates detection + loading screen + redirect
    =================================================================== */
    (function () {
      "use strict";

      /* ── Configuration ──────────────────────────────────────────────── */
      const CFG = {
        /* Redirect targets — relative to this file's location (repo root) */
        mobileUrl:  "mobile-2/index.html",
        desktopUrl: "desktop.html",

        /* sessionStorage key — prevents redirect loops.
           When set, this page will NOT redirect again.                  */
        loopKey: "pf_routed",

        /* Minimum physics score (0-100) to classify as mobile           */
        mobileThreshold: 52,

        /* How long to show the loading screen before navigating (ms)    */
        displayMs: 900,

        /* Screen width breakpoint below which screen score favours mobile */
        narrowPx: 500,

        /* DPR above which small screens likely are phones (Retina, OLED) */
        hiDprThreshold: 1.8,
      };

      /* ── DOM refs ────────────────────────────────────────────────────── */
      const statusEl   = document.getElementById("pf-status");
      const signalsEl  = document.getElementById("pf-signals");
      const resultEl   = document.getElementById("pf-result");

      const sigBars = {
        ua: document.getElementById("sig-ua"),
        pl: document.getElementById("sig-pl"),
        tc: document.getElementById("sig-tc"),
        sc: document.getElementById("sig-sc"),
      };
      const sigVals = {
        ua: document.getElementById("sigv-ua"),
        pl: document.getElementById("sigv-pl"),
        tc: document.getElementById("sigv-tc"),
        sc: document.getElementById("sigv-sc"),
      };

      /* ── Helpers ─────────────────────────────────────────────────────── */
      const setStatus = (msg) => { if (statusEl) statusEl.textContent = msg; };

      const updateBar = (key, score) => {
        /* score is 0-100 where 100 = maximum confidence of "mobile"     */
        if (sigBars[key])  sigBars[key].style.width  = score + "%";
        if (sigVals[key])  sigVals[key].textContent  = score;
      };

      /* ── Signal 1: User-Agent Analysis ──────────────────────────────── */
      /*
         UA strings are not perfectly reliable (can be spoofed) but remain
         the strongest single signal for phone detection.

         Phone patterns     → score 100 (strong mobile signal)
         Tablet patterns    → score 30  (tablet is "not phone")
         Desktop OS         → score 0   (no mobile signal at all)
         Touch laptop hints → score 10  (light signal, overridden by platform)

         The function returns a 0–100 score where:
           100 = definitely a phone UA
           0   = definitely not a phone UA
      */
      function getUAScore(ua) {
        const u = ua.toLowerCase();

        /* ── Strong phone indicators ─────────────────────────── */
        /* Android without "tablet" keyword — typically a phone  */
        if (/android/.test(u) && !/tablet/.test(u)) {
          /* Extra check: Samsung Galaxy S/A/Note series are phones */
          if (/mobile/.test(u) || /samsung/.test(u)) return 100;
          /* Android with large screen hint is probably a tablet  */
          if (/sm-t|gt-p|gt-n|sch-i|shv-e/.test(u))  return 20;
          return 85; /* Generic Android — assume phone             */
        }

        /* iPhone — always a phone                               */
        if (/iphone/.test(u))                         return 100;

        /* Foldable phones (Galaxy Fold, Motorola Razr, etc.)    */
        if (/fold|flip|razr/.test(u))                 return 90;

        /* Windows Phone (legacy, rare)                          */
        if (/windows phone/.test(u))                  return 100;

        /* Feature phones / older mobile browsers                */
        if (/blackberry|bb10|meego|palm|symbian/.test(u)) return 100;

        /* Generic "Mobile" keyword without any tablet/desktop OS */
        if (/mobile/.test(u) && !/tablet/.test(u))    return 80;

        /* ── Tablet indicators — NOT phones ─────────────────── */
        /* iPad                                                  */
        if (/ipad/.test(u))                           return 15;

        /* Android tablet (explicit keywords)                    */
        if (/android.*tablet|tablet.*android/.test(u)) return 15;

        /* Kindle / Fire tablet                                  */
        if (/kindle|silk|kftt|kfjwi|kfjwa|kfot/.test(u)) return 10;

        /* ── Desktop OS indicators ───────────────────────────── */
        /* Windows desktop (not Windows Phone)                   */
        if (/windows nt/.test(u) && !/windows phone/.test(u)) return 0;

        /* macOS desktop (not iOS)                               */
        if (/macintosh|mac os x/.test(u) && !/iphone|ipad/.test(u)) return 0;

        /* Linux desktop                                         */
        if (/linux/.test(u) && !/android/.test(u))    return 0;

        /* ChromeOS                                              */
        if (/cros/.test(u))                           return 5;

        /* ── Default — unknown UA ────────────────────────────── */
        return 35; /* Unknown → slight mobile lean for safety    */
      }

      function getPlatformScore() {
        const uad = navigator.userAgentData;

        /* API not available */
        if (!uad) return null;

        const plat = (uad.platform || "").toLowerCase();

        /* userAgentData.mobile is a boolean — the most reliable signal */
        if (typeof uad.mobile === "boolean") {
          if (uad.mobile) return 90;  /* Browser says it's a mobile device */
          /* Browser says NOT mobile — check platform name as tiebreak    */
          if (/android|ios|iphone|samsung/.test(plat)) return 85;
          if (/windows|macos|linux/.test(plat))         return 0;
          return 10; /* Unknown platform but not mobile                   */
        }

        /* Fallback: platform string only (no .mobile boolean)           */
        if (/android|ios|iphone|samsung/.test(plat)) return 80;
        if (/windows|macos|linux/.test(plat))         return 0;
        return null; /* Can't determine — exclude this signal             */
      }

      /* ── Signal 3: Touch Support ────────────────────────────────────── */

      function getTouchScore() {
        const maxTouch = navigator.maxTouchPoints || 0;

        /* No touch at all — definitely desktop input device              */
        if (maxTouch === 0)  return 0;

        /* 1 touch point — likely a laptop with a touchscreen             */
        if (maxTouch === 1)  return 35;

        /* 2 touch points — could be a simple touch device               */
        if (maxTouch === 2)  return 50;

        /* 5+ touch points — typical smartphone / tablet capacitive screen */
        if (maxTouch >= 5)   return 72;

        return 45; /* 3-4 touch points — borderline                       */
      }

      /* ── Signal 4: Screen Size + Device Pixel Ratio ─────────────────── */
      
      function getScreenScore() {
        const w   = screen.width;
        const h   = screen.height;
        const dpr = window.devicePixelRatio || 1;

        /* Physical shorter dimension — handles both orientations         */
        const shortSide = Math.min(w, h);

        /* Very narrow physical screen + high DPR = phone                */
        if (shortSide <= 390 && dpr >= CFG.hiDprThreshold) return 95;
        if (shortSide <= 430 && dpr >= CFG.hiDprThreshold) return 88;

        /* Narrow even at low DPR                                        */
        if (shortSide <= CFG.narrowPx)  return 78;
        if (shortSide <= 600)           return 60;

        /* Medium — could be tablet                                      */
        if (shortSide <= 768)           return 35;
        if (shortSide <= 900)           return 18;

        /* Wide screen — clearly a desktop/laptop                        */
        if (shortSide > 900)            return 0;

        return 30; /* fallback                                            */
      }

      /* ── Confidence Combiner ─────────────────────────────────────────── */
     
      function combineScores(ua, pl, tc, sc) {
        if (pl !== null) {
          /* Full set: UA + Platform + Screen + Touch                     */
          return Math.round(ua * 0.40 + pl * 0.30 + sc * 0.20 + tc * 0.10);
        } else {
          /* Platform unavailable — redistribute its 30% weight          */
          /* UA gets +15, Screen gets +10, Touch gets +5                  */
          return Math.round(ua * 0.55 + sc * 0.30 + tc * 0.15);
        }
      }

      /* ── Main Detection Function ─────────────────────────────────────── */
      function detectDevice() {
        const ua = navigator.userAgent || "";

        /* Collect raw scores                                             */
        const uaScore      = getUAScore(ua);
        const platformScore = getPlatformScore();       /* null if unavailable */
        const touchScore   = getTouchScore();
        const screenScore  = getScreenScore();

        /* Combine into final 0-100 mobile confidence score             */
        const confidence = combineScores(uaScore, platformScore, touchScore, screenScore);

        /* Classify based on threshold                                   */
        const type = confidence >= CFG.mobileThreshold ? "mobile" : "desktop";

        /* Return full diagnostic object for logging & UI               */
        return {
          type,
          confidence,
          threshold: CFG.mobileThreshold,
          scores: {
            ua:       uaScore,
            platform: platformScore,
            touch:    touchScore,
            screen:   screenScore,
          },
          meta: {
            userAgent:    ua,
            platform:     (navigator.userAgentData?.platform || navigator.platform || "unknown"),
            screenW:      screen.width,
            screenH:      screen.height,
            dpr:          window.devicePixelRatio || 1,
            maxTouch:     navigator.maxTouchPoints || 0,
            uadAvailable: !!navigator.userAgentData,
          },
        };
      }

      /* ── Redirect Logic ─────────────────────────────────────────────── */
      
      function routeTo(type) {
        try {
          sessionStorage.setItem(CFG.loopKey, type);
        } catch (_) {
          /* Private browsing may block sessionStorage — proceed anyway  */
        }

        const url = type === "mobile" ? CFG.mobileUrl : CFG.desktopUrl;
        window.location.replace(url);
      }

      /* ── Loop Guard ─────────────────────────────────────────────────── */
      
      function alreadyRouted() {
        try {
          return !!sessionStorage.getItem(CFG.loopKey);
        } catch (_) {
          return false; /* Can't read storage — assume no loop            */
        }
      }

      /* ── Run ─────────────────────────────────────────────────────────── */
      function run() {
        /* ── Loop guard: skip routing if already done this session ─── */
        if (alreadyRouted()) {
          console.warn("[PF Router] Loop guard triggered — routing skipped.");
          setStatus("Portfolio loaded.");
          return;
        }

        /* ── Phase 1: Initialise UI ──────────────────────────────── */
        setStatus("Scanning device signals...");

        /* ── Phase 2: Run detection (synchronous) ────────────────── */
        const result = detectDevice();

        /* ── Phase 3: Console diagnostics ───────────────────────── */
        console.group("[PF Router] Device Detection");
        console.log("Device type       :", result.type.toUpperCase());
        console.log("Mobile confidence :", result.confidence + "% (threshold: " + result.threshold + "%)");
        console.log("Decision          :", result.confidence >= result.threshold
          ? "REDIRECT → " + CFG.mobileUrl
          : "REDIRECT → " + CFG.desktopUrl);
        console.log("─── Signal Scores ───────────────────────────");
        console.log("User-Agent score  :", result.scores.ua);
        console.log("Platform score    :", result.scores.platform !== null ? result.scores.platform : "N/A (API unavailable)");
        console.log("Touch score       :", result.scores.touch);
        console.log("Screen score      :", result.scores.screen);
        console.log("─── Device Meta ─────────────────────────────");
        console.log("User-Agent        :", result.meta.userAgent);
        console.log("Platform          :", result.meta.platform);
        console.log("Screen            :", result.meta.screenW + "×" + result.meta.screenH + " @ " + result.meta.dpr + "x DPR");
        console.log("Max touch points  :", result.meta.maxTouch);
        console.log("userAgentData API :", result.meta.uadAvailable ? "available" : "unavailable");
        console.groupEnd();

        /* ── Phase 4: Update loading screen UI ───────────────────── */
        setTimeout(function () {
          /* Show signal bars */
          if (signalsEl) signalsEl.classList.add("is-visible");
          setStatus("Analysing signals...");

          updateBar("ua", result.scores.ua);
          updateBar("pl", result.scores.platform !== null ? result.scores.platform : 0);
          updateBar("tc", result.scores.touch);
          updateBar("sc", result.scores.screen);

          sigVals.ua.textContent = result.scores.ua;
          sigVals.pl.textContent = result.scores.platform !== null ? result.scores.platform : "N/A";
          sigVals.tc.textContent = result.scores.touch;
          sigVals.sc.textContent = result.scores.screen;
        }, 80);

        /* Show result label then redirect */
        setTimeout(function () {
          const label = result.type === "mobile" ? "MOBILE DETECTED" : "DESKTOP DETECTED";
          if (resultEl) {
            resultEl.textContent = label + " (" + result.confidence + "%)";
            resultEl.classList.add("is-visible");
          }
          setStatus("Routing to " + (result.type === "mobile" ? "mobile" : "desktop") + " version...");
        }, CFG.displayMs - 200);

        /* ── Phase 5: Redirect ───────────────────────────────────── */
        setTimeout(function () {
          routeTo(result.type);
        }, CFG.displayMs);
      }

      /* ── Boot ────────────────────────────────────────────────────────── */
      /* Run as soon as DOM is ready (script is deferred via inline position) */
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
      } else {
        run();
      }

    }()); /* end IIFE */
    </script>

  </body>
</html>
